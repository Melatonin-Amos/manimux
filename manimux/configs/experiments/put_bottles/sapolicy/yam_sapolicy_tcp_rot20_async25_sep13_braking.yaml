  inference_schedule: single_inflight
  request_trigger: refill
  action_start_mode: drop_infer_latency
  refill_threshold_s: 0.2
  max_plan_age_s: 2.0
  blend_policy_steps: 4
  blend_mode: linear
  chunk_policy_steps: 25
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    tracking_mode: braking
    max_velocity: null
    max_acceleration: null
    position_limit_abs: 3.14
    grasp_guard: null
    release_guard: null
    gripper:
      mode: continuous
      max_velocity: null
      max_acceleration: null
      max_closing_velocity: null
camera_server:
  config: ../../../embodiment/sensor/cameras/realsense_3_views.yaml
