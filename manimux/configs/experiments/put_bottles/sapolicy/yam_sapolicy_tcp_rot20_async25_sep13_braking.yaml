  task: put bottle in bin
  output_dir: ./data/experiments/sapolicy-put-bottles-tcp-rot20-step50000/async25-sep13-braking8-noguard-unlimited
  max_control_steps: 18000
  experiment_mode: false
  warmup_before_start: false
robot:
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    move_to_start_on_connect: false
    start_joints:
      left_arm:
      - -0.21648737315937971
