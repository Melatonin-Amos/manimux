# Based on 4da6a10 MV51 Top rollout settings, migrated to the current schema.
# Intentional overrides: tcp_rot20 RAW 50k checkpoint and user-requested braking
# (the historical commit used legacy tracking). Current runtime implementation.
# Historical geometry: stock grasp_site, no October mount/crank-site corrections.
