control_profile: ../../embodiment/robot/yam_control_unlimited.yaml
run:
  max_control_steps: 12000
  warmup_before_start: true
  sensor_reading:
    mode: background
    poll_hz: 100.0
    max_frame_age_s: 0.5
    startup_timeout_s: 5.0
    shutdown_timeout_s: 2.0
robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    move_to_start_on_connect: true
    home_duration_s: 2.0
    home_on_close: true
    execute: true
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names:
    - d405_left
    - d405_front
    - d405_right
policy:
  action_dt_s: 0.03333333333333333
  worker: xpolicylab_ws
  service: policy
  adapter:
    type: manimux.policy_adapter.joint:JointAdapter
    camera_map:
      cam_head: d405_front
      cam_left_wrist: d405_left
      cam_right_wrist: d405_right
  timeout_s: 2.0
  horizon_policy_steps: 50
  startup_timeout_s: 30.0
  options:
    action_format: joint
    request_timeout_s: 10.0
robogui:
  enabled: true
  robot: yam
recording:
  enabled: true
  video_fps: 30.0
inference:
  blend_policy_steps: 0
executor:
  type: direct
policy_server:
  config: ../../policy/pi05/yam/latest300/joint-step30000.yaml
camera_server:
  config: ../../embodiment/sensor/cameras/realsense_3_views.yaml
initial_pose:
  config: ../../embodiment/initial_poses/yam.yaml
  id: home
